[theme]
base = "light"
primaryColor = "#C9A227"              # gold
backgroundColor = "#FFFFFF"           # white
secondaryBackgroundColor = "#F6F4EE"
textColor = "#0B0B0B"                 # black
linkColor = "#A8841C"
borderColor = "#E8E4DA"
baseRadius = "0.6rem"
showSidebarBorder = false

[theme.sidebar]
backgroundColor = "#0B0B0B"           # black sidebar
secondaryBackgroundColor = "#1A1A1A"
textColor = "#EDEDED"
primaryColor = "#D4AF37"
borderColor = "#2A2A2A"
linkColor = "#E6C766"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 25
